name: Deploy Inkweaver AI
# Trigger deployment after Supabase credentials are configured.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/inkweaver-companion/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-inkweaver-ai.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Inkweaver Companion
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF repository secret" && exit 1)
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy inkweaver-companion --project-ref "$SUPABASE_PROJECT_REF" --yes
